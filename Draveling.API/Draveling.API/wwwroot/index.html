<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draveling – Simple Travel Planning Tools</title>
    <meta name="description" content="Draveling offers simple, free tools to help you plan your trip, starting with a trip budget calculator." />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Draveling.API.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Start the app in the language given by the URL prefix (/hy/..., /ru/...), English otherwise.
        // Keep this list in sync with Localization/Languages.cs.
        (function () {
            var supported = ['hy', 'ru'];
            var preferenceKey = 'draveling.lang';

            var basePath = new URL(document.baseURI).pathname;
            var relativePath = location.pathname.indexOf(basePath) === 0
                ? location.pathname.substring(basePath.length)
                : location.pathname.replace(/^\//, '');
            var firstSegment = relativePath.split('/')[0];

            var language = 'en';
            if (supported.indexOf(firstSegment) >= 0) {
                language = firstSegment;
            } else {
                // No prefix: send returning visitors to the language they chose earlier.
                var preferred = null;
                try { preferred = localStorage.getItem(preferenceKey); } catch (e) { }
                if (preferred && supported.indexOf(preferred) >= 0) {
                    location.replace(basePath + preferred + '/' + relativePath + location.search + location.hash);
                    return;
                }
            }

            document.documentElement.lang = language;
            Blazor.start({ applicationCulture: language });
        })();
    </script>
</body>

</html>
